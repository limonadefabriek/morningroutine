<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning routine">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Morning routine Limonadefabriek</title>
<meta name="description" content="An eight-minute no-equipment morning routine in a single offline page.">
<meta property="og:title" content="Morning routine Limonadefabriek">
<meta property="og:description" content="An eight-minute no-equipment morning routine in a single offline page.">
<style>
:root{
  --bg:#0a0a0b;
  --ink:#ece9e3;
  --soft:#7d7a74;
  --dim:#4a4845;
  --rule:#212125;
  --accent:#c3f04a;
  --warn:#ff8a5c;
  --stage:#111114;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
body.paused{opacity:.55}
#app{max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}

h1,h2{font-weight:800;letter-spacing:-.035em;text-transform:uppercase;margin:0}
.dim{color:var(--dim)}
.eyebrow{
  margin:0 0 12px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}

/* ---------------- home ---------------- */
.mast{padding:calc(34px + env(safe-area-inset-top)) 20px 20px;border-bottom:1px solid var(--rule)}
.mast h1{font-size:34px;line-height:1}
.lede{color:var(--soft);font-size:15px;margin:12px 0 0;max-width:38ch}
.stats{display:flex;gap:20px;margin:16px 0 0;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--soft);font-weight:600;flex-wrap:wrap}
.stats b{color:var(--ink);font-size:15px;font-weight:800;letter-spacing:-.02em;margin-right:5px}
.stats.center{justify-content:center}

.banner{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
  background:var(--accent);color:#0a0a0b;border:0;text-align:left;
  padding:15px 20px;font:700 12px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
}
.banner .arrow{font-size:16px}

.quote{
  margin:0;padding:20px 20px 20px 34px;position:relative;
  border-bottom:1px solid var(--rule);
  font-size:18px;line-height:1.32;color:var(--ink);
  font-weight:600;letter-spacing:-.015em;
}
.quote::before{
  content:"";position:absolute;left:20px;top:23px;
  width:3px;height:calc(100% - 46px);background:var(--accent);
}

.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--rule)}
.row-n{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.06em;width:18px;flex:0 0 auto}
.row-body{flex:1;min-width:0}
.row-name{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.row-sub{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:3px}
.row-fig{flex:0 0 76px;width:76px;opacity:.75}
.row-fig svg{display:block;width:100%;height:auto}

.pad{padding:24px 20px 40px}
.cta{
  display:block;width:100%;border:0;cursor:pointer;
  background:var(--accent);color:#0a0a0b;
  padding:20px;font:800 15px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:12px;
}
.cta.ghost{background:none;color:var(--soft);border:1px solid var(--rule)}
.minor{display:flex;gap:8px;margin-bottom:20px}
.minor button{
  flex:1;background:none;border:1px solid var(--rule);color:var(--soft);
  padding:12px 4px;font:600 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
.voice{
  display:flex;width:100%;align-items:center;justify-content:space-between;
  background:none;border:1px solid var(--rule);color:var(--soft);
  padding:14px 16px;margin-bottom:20px;cursor:pointer;
  font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
}
.voice.on{color:var(--ink);border-color:#3a4a18}
.voice .v-state{color:var(--dim);font-weight:700}
.voice.on .v-state{color:var(--accent)}

.extras-lbl{
  margin:0 0 10px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);font-weight:700;
}
.extras{display:flex;gap:8px;margin-bottom:22px}
.extras button{
  flex:1;background:none;border:1px solid var(--rule);color:var(--ink);
  padding:14px 8px;cursor:pointer;font-family:var(--sans);text-align:left;
}
.extras .x-n{display:block;font-size:13px;font-weight:600;letter-spacing:-.01em}
.extras .x-t{display:block;margin-top:3px;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);font-weight:700}

.foot{color:var(--dim);font-size:12.5px;line-height:1.55;margin:0}
.foot.center{text-align:center}

/* ---------------- session ---------------- */
.bar-wrap{height:2px;background:var(--rule)}

/* pinned session header — timer and exercise name stay put while you scroll */
.topbar{
  position:sticky;top:0;z-index:12;background:var(--bg);
  border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);
}
.topbar-in{display:flex;align-items:center;gap:15px;padding:12px 20px 13px;text-align:left}
.topmeta{flex:1;min-width:0}
.topbar .eyebrow{margin:0 0 3px;font-size:9px;letter-spacing:.16em}
.topbar .exname{font-size:19px;line-height:1.08;margin:0 0 3px}
.topbar .exvar{margin:0;font-size:9.5px;letter-spacing:.12em}
.prep .topbar .exname{color:var(--soft)}
.bar{height:2px;background:var(--accent);width:0;transition:width .9s linear}
.screen{padding:20px 20px 40px;text-align:center}
.screen .eyebrow{margin-bottom:10px}
.exname{font-size:27px;line-height:1.04;margin-bottom:6px}
.exvar{
  margin:0 0 18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}

.clock{position:relative;width:132px;height:132px;margin:0 auto 18px}
.clock.inline{width:112px;height:112px;margin-bottom:14px}
.clock.mini{width:62px;height:62px;margin:0;flex:0 0 62px}
.clock.mini .count{font-size:23px;letter-spacing:-.04em}
.ring-fg{stroke-width:5}
.clock.mini .ring-bg,.clock.mini .ring-fg{stroke-width:6}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--rule);stroke-width:5}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear}
.count{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;
}

.stage{background:var(--stage);margin:0 0 18px;position:relative}
.stage.small{max-width:260px;margin:0 auto 14px}
.stage svg{display:block;width:100%;height:auto}
.switchflag{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#0a0a0b;font:800 15px/1 var(--sans);
  letter-spacing:.16em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .2s;
}
.switchflag.on{opacity:1;animation:pulse .6s ease-in-out 3}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.how{margin:0 0 16px;font-size:15px;line-height:1.55;text-align:left;color:#d7d4ce}
.how.center{text-align:center;max-width:34ch;margin:0 auto 22px}
.cues{list-style:none;margin:0 0 24px;padding:14px 0 0;border-top:1px solid var(--rule);text-align:left}
.cues li{display:flex;gap:11px;margin-bottom:9px;font-size:13.5px;color:var(--soft);line-height:1.45}
.cues li:last-child{margin-bottom:0}
.cues .k{
  flex:0 0 36px;font-size:9.5px;letter-spacing:.1em;font-weight:700;
  text-transform:uppercase;color:var(--dim);padding-top:3px;
}
.cues li.warn .k{color:var(--warn)}
.cues li.warn{color:#c8b5ab}

.controls{display:flex;gap:8px;margin-bottom:14px}
.controls button{
  flex:1;background:none;border:1px solid var(--rule);color:var(--ink);
  padding:17px 4px;font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
}
.controls #pause{border-color:var(--accent);color:var(--accent)}
.quit{
  width:100%;background:none;border:0;color:var(--dim);
  padding:10px;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
}

/* next-up strip on an exercise screen */
.peek{
  display:flex;align-items:center;gap:12px;text-align:left;
  border-top:1px solid var(--rule);padding:13px 0 0;margin:0 0 20px;
}
.peek-fig{flex:0 0 62px;width:62px;opacity:.5}
.peek-fig svg{display:block;width:100%;height:auto}
.peek-body{flex:1;min-width:0}
.peek-k{
  display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:3px;
}
.peek-n{display:block;font-size:14.5px;font-weight:600;color:var(--soft);letter-spacing:-.01em}
.peek-s{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.peek.last{display:block;padding-bottom:2px}
.peek.last .peek-n{margin-top:1px}

/* the single interval before every exercise */
.prep .topbar .count{color:var(--accent)}
.prep .preplbl{
  margin:0 0 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:700;
}
.prep .stage{opacity:.85}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:99}

.done{padding-top:calc(70px + env(safe-area-inset-top))}
.done .stats{margin-bottom:14px}
.done .foot{margin-bottom:34px}
.bigdone{font-size:42px;line-height:.95;margin-bottom:20px}

/* ---------------- check-in ---------------- */
.field{display:block;margin-bottom:20px}
.flabel{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:8px}
.field input,.field select{
  width:100%;background:var(--stage);border:1px solid var(--rule);color:var(--ink);
  padding:15px;font:600 17px/1 var(--sans);border-radius:0;appearance:none;
}
.prev{display:block;margin-top:7px;font-size:11.5px;color:var(--dim)}
.cmp{width:100%;border-collapse:collapse;margin:0 0 26px;font-size:13.5px}
.cmp td{padding:11px 4px;border-bottom:1px solid var(--rule);color:var(--soft);text-align:left}
.cmp td:last-child,.cmp td:nth-child(2){text-align:right;width:64px}
.cmp td b{color:var(--accent)}
.cmp .arrow{width:24px;text-align:center;color:var(--dim)}

/* ---------------- figures ---------------- */
.fig{color:var(--ink)}
.fig .seg{stroke:currentColor;stroke-linecap:round;fill:none}
.fig .torso{stroke-width:15}
.fig .chest{stroke-width:17.5}
.fig .hips{stroke-width:14}
.fig .thigh{stroke-width:12}
.fig .shin{stroke-width:8.5}
.fig .uarm{stroke-width:8}
.fig .farm{stroke-width:6.5}
.fig .foot{stroke-width:6}
.fig .neck{stroke-width:6.5}
.fig .head{fill:currentColor;stroke:none}
.fig .far{opacity:.34}
.fig .work{stroke:var(--accent)}
.fig .prop{fill:var(--rule)}
.fig .ground{stroke:#26262a;stroke-width:2;stroke-dasharray:1 8;stroke-linecap:round}

.fr1{animation:fa 3.4s ease-in-out infinite}
.fr2{animation:fb 3.4s ease-in-out infinite}
@keyframes fa{0%,36%{opacity:1}50%,86%{opacity:0}100%{opacity:1}}
@keyframes fb{0%,36%{opacity:0}50%,86%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fr1,.fr2{animation:none}.fr2{opacity:.3}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   8-MINUTE MORNING — routine data, figure renderer, timer
   ============================================================ */

/* ---------- pose helper ----------------------------------
   Each pose is a set of joint coordinates in a 220 x 132 box.
   Ground line sits at y = 122.
     h   head [x, y, rotation]
     s   shoulder        hp  hip
     e   elbow (near)    w   wrist (near)
     eF  elbow (far)     wF  wrist (far)
     k   knee (near)     a   ankle (near)   t  toe (near)
     kF  knee (far)      aF  ankle (far)    tF toe (far)
     w_  which limbs are highlighted: 'arm' 'leg' 'armF' 'legF'
   Far limbs are auto-derived with a small offset when omitted,
   which is what gives the figures their sense of depth.
---------------------------------------------------------- */

const off = (p, dx, dy) => p ? [p[0] + dx, p[1] + dy] : null;

function fillFar(p) {
  const q = Object.assign({}, p);
  if (!q.kF && q.k) { q.kF = off(q.k, 5, 2); q.aF = off(q.a, 5, 2); q.tF = off(q.t, 5, 2); }
  if (!q.eF && q.e) { q.eF = off(q.e, 5, 2); q.wF = off(q.w, 5, 2); }
  return q;
}

function seg(cls, p1, p2, work) {
  if (!p1 || !p2) return '';
  return `<line class="seg ${cls}${work ? ' work' : ''}" x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"/>`;
}
const mid = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];

function figure(pose, props) {
  const p = fillFar(pose);
  const W = p.w_ || [];
  const has = n => W.indexOf(n) >= 0;
  let o = '';

  // scenery (chair / couch edges)
  if (props) props.forEach(r => {
    o += `<rect class="prop" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="2"/>`;
  });

  // far side limbs, faded back
  o += `<g class="far"${p.fo ? ` style="opacity:${p.fo}"` : ''}>`;
  o += seg('thigh', p.hp, p.kF) + seg('shin', p.kF, p.aF) + seg('foot', p.aF, p.tF);
  o += seg('uarm', p.s, p.eF) + seg('farm', p.eF, p.wF);
  o += '</g>';

  // trunk
  o += seg('hips', mid(p.hp, p.s, -0.12), p.hp);
  o += seg('torso', p.hp, p.s);
  o += seg('chest', p.s, mid(p.s, p.hp, 0.5));
  if (p.h) {
    o += seg('neck', p.s, mid(p.s, [p.h[0], p.h[1]], 0.55));
    o += `<ellipse class="head" cx="${p.h[0]}" cy="${p.h[1]}" rx="7.4" ry="8.4" transform="rotate(${p.h[2] || 0} ${p.h[0]} ${p.h[1]})"/>`;
  }

  // near side limbs, in front
  o += seg('thigh', p.hp, p.k, has('leg')) + seg('shin', p.k, p.a, has('leg')) + seg('foot', p.a, p.t);
  o += seg('uarm', p.s, p.e, has('arm')) + seg('farm', p.e, p.w, has('arm'));

  return o;
}

function figureSVG(ex, frame) {
  const n = ex.f.length;
  const i = frame === undefined ? (ex.thumb !== undefined ? ex.thumb : Math.min(1, n - 1)) : Math.min(frame, n - 1);
  return `<svg class="fig" viewBox="0 0 220 132" aria-hidden="true">
    <line class="ground" x1="8" y1="122" x2="212" y2="122"/>
    ${figure(ex.f[i], ex.props)}
  </svg>`;
}

/* ------------------------------------------------------------
   Tweened figure.

   Rather than cross-fading two drawings, this walks the joints
   from one keyframe to the next and redraws every frame, so the
   limbs actually travel. Exercises can carry 2, 3 or 4 keyframes;
   the cycle ping-pongs through them (…→2→3→2→1→0→1→…) which is
   what a rep looks like.
------------------------------------------------------------ */

const JOINTS = ['hp', 's', 'k', 'a', 't', 'e', 'w', 'kF', 'aF', 'tF', 'eF', 'wF'];

function lerpPose(A, B, u) {
  const out = {};
  JOINTS.forEach(j => {
    if (A[j] && B[j]) out[j] = [A[j][0] + (B[j][0] - A[j][0]) * u, A[j][1] + (B[j][1] - A[j][1]) * u];
    else out[j] = A[j] || B[j];
  });
  if (A.h && B.h) {
    out.h = [A.h[0] + (B.h[0] - A.h[0]) * u,
             A.h[1] + (B.h[1] - A.h[1]) * u,
             (A.h[2] || 0) + ((B.h[2] || 0) - (A.h[2] || 0)) * u];
  } else out.h = A.h || B.h;
  out.fo = A.fo !== undefined ? A.fo : B.fo;
  out.w_ = u < 0.5 ? A.w_ : B.w_;   // the highlight follows the nearer keyframe
  return out;
}

let animId = 0;
const running = new Map();

function animatedFigure(ex) {
  const id = ++animId;
  return `<svg class="fig" data-anim="${id}" viewBox="0 0 220 132" role="img" aria-label="${ex.n}">
    <line class="ground" x1="8" y1="122" x2="212" y2="122"/>
    <g class="body">${figure(ex.f[0], ex.props)}</g>
  </svg>`;
}

function startAnims(ex) {
  stopAnims();
  const svg = document.querySelector('svg[data-anim]');
  if (!svg) return;
  const body = svg.querySelector('.body');
  const poses = ex.f.map(fillFar);

  // a still frame is the right answer when the viewer asked for less motion
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    body.innerHTML = figure(ex.f[Math.min(1, poses.length - 1)], ex.props);
    return;
  }

  // ping-pong leg count: 2 poses -> 2 legs, 4 poses -> 6 legs
  const legs = poses.length === 1 ? 1 : (poses.length - 1) * 2;
  const cycle = ex.speed || 2800;   // milliseconds for one full there-and-back cycle
  let raf = 0, t0 = 0;

  function tick(now) {
    if (!t0) t0 = now;
    const phase = ((now - t0) % cycle) / cycle;     // 0..1 over the whole cycle
    const pos = phase * legs;                        // which leg we are on
    const leg = Math.floor(pos);
    let u = pos - leg;
    u = 0.5 - 0.5 * Math.cos(Math.PI * u);           // ease in and out of each leg

    const half = poses.length - 1;
    const from = leg < half ? leg : legs - leg;
    const to = leg < half ? leg + 1 : legs - leg - 1;

    body.innerHTML = figure(lerpPose(poses[from], poses[to], u), ex.props);
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  running.set(svg, () => cancelAnimationFrame(raf));
}

function stopAnims() {
  running.forEach(stop => stop());
  running.clear();
}

/* ============================================================
   THE EXERCISES
   ============================================================ */

const EX = {

  /* ---------------- DAY A ---------------- */

  inchworm: {
    n: 'Inchworm to cobra', slot: 'Flow', dur: 60,
    how: "Stand tall. Fold forward, hands to the floor, then walk them out until you're long in a plank. Let the hips sink and lift the chest — that's the cobra. Walk the hands back to your feet and roll up.",
    c: [['Range', "Legs as straight as they'll go on the way out. That's where the hamstring stretch lives."],
        ['Tempo', "Four counts out, four back. It's a wake-up, not a sprint."],
        ['Watch', "Don't let the lower back sag when your hands are furthest forward — squeeze the glutes.", 1]],
    prog: ['Bend the knees as much as you like', 'Knees soft', 'Legs as straight as they go', 'Add one push-up in the plank', 'Push-up in the plank, then walk the feet to the hands'],
    thumb: 1, speed: 4200,
    f: [
      { hp:[165,58], s:[163,28], h:[161,15,0], k:[167,88], a:[167,118], t:[176,120], e:[169,46], w:[171,64] },
      { hp:[157,58], s:[128,76], h:[106,97,-46], k:[162,89], a:[167,116], t:[176,118], e:[129,97], w:[127,117] },
      { hp:[128,100], s:[96,88], h:[84,82,72], k:[150,110], a:[172,117], t:[181,119], e:[94,103], w:[92,118] },
      { hp:[128,112], s:[96,86], h:[83,71,30], k:[150,116], a:[173,117], t:[182,114], e:[93,101], w:[90,118], w_:['arm'] }
    ]
  },

  pushup: {
    n: 'Push-ups, slow', slot: 'Push', dur: 45,
    how: "Hands under the shoulders, body one straight line from heels to head. Lower your chest towards the floor over two counts, then press back up.",
    c: [['Line', "Ribs down, glutes squeezed. The hips should not arrive before the chest."],
        ['Elbows', "Roughly 45° from the body, not flared out sideways."],
        ['Depth', "Chest to a fist's height off the floor. Half reps do half the work.", 1]],
    prog: ['Knees on the floor', 'Hands up on the couch', 'Standard, 2s down', '3s down, 1s pause at the bottom', 'Feet up on the couch'],
    f: [
      { hp:[126,92], s:[92,80], h:[78,74,72], k:[152,104], a:[176,116], t:[185,118], e:[94,99], w:[96,118] },
      { hp:[130,104], s:[88,95], h:[74,90,72], k:[154,112], a:[177,118], t:[186,120], e:[100,100], w:[96,118], w_:['arm'] }
    ]
  },

/* ============================================================
   STATE
   ============================================================ */

const KEY = 'morning8.v1';
const defState = { level: 3, next: 'A', log: [], checks: [], voice: true };
let S = load();

function load() {
  try { return Object.assign({}, defState, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch (e) { return Object.assign({}, defState); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

const today = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

function streak() {
  if (!S.log.length) return 0;
  const dates = [...new Set(S.log.map(l => l.d))].sort().reverse();
  const t = today();
  let n = 0, cursor = daysBetween(dates[0], t) <= 1 ? dates[0] : null;
  if (!cursor) return 0;
  for (const d of dates) {
    if (d === cursor) { n++; cursor = new Date(new Date(cursor) - 864e5).toISOString().slice(0, 10); }
  }
  return n;
}

function checkDue() {
  if (!S.checks.length) return S.log.length >= 10;
  return daysBetween(S.checks[S.checks.length - 1].d, today()) >= 14;
}

/* ============================================================
   BUILD THE SEQUENCE
   ============================================================ */

function buildSequence(dayKey) {
  const q = [];
  dayItems(dayKey).forEach((it, i) => {
    q.push({ kind: 'prep', id: it.id, dur: PREP, n: i + 1 });
    q.push({ kind: 'work', id: it.id, dur: it.dur, n: i + 1 });
  });
  return q;
}

// id of the exercise in the next work step after index i, or null if that was the last
function nextWorkStep(i) {
  for (let j = i + 1; j < sess.q.length; j++) if (sess.q[j].kind === 'work') return sess.q[j];
  return null;
}
const totalTime = dayKey => buildSequence(dayKey).reduce((a, s) => a + s.dur, 0);
const mmss = s => Math.floor(s / 60) + 'm' + String(Math.round(s) % 60).padStart(2, '0') + 'sec';

/* ============================================================
   SOUND
   ============================================================ */

let actx = null;
function beep(freq, ms, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, actx.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.16, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + ms / 1000);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + ms / 1000 + 0.02);
  } catch (e) {}
}
const tick   = () => beep(660, 90, 0.10);
const go     = () => { beep(880, 150, 0.18); setTimeout(() => beep(1180, 220, 0.18), 150); };
const switchS= () => { beep(520, 120, 0.16); setTimeout(() => beep(520, 120, 0.16), 180); };
const done   = () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 320, 0.16), i * 150)); };

   VOICE — the phone's own speech synthesiser, so nothing is
   downloaded and it works offline. Lines are deliberately clipped;
   you should be able to follow the session without looking.

];

let VOICE = null;
const speechOK = () => typeof window !== 'undefined' && 'speechSynthesis' in window;

function pickVoice() {
  if (!speechOK()) return null;
  const all = speechSynthesis.getVoices();
  if (!all.length) return null;
  const en = all.filter(v => /^en/i.test(v.lang));
  const want = [/daniel/i, /arthur/i, /google uk english male/i, /alex/i, /aaron/i,
                /oliver/i, /fred/i, /rishi/i, /\bmale\b/i];
  for (const re of want) { const m = en.find(v => re.test(v.name)); if (m) return m; }
  return en[0] || all[0];
}
if (speechOK()) speechSynthesis.addEventListener('voiceschanged', () => { VOICE = pickVoice(); });

function say(text, queue) {
  if (!S.voice || !speechOK() || !text) return;
  try {
    if (!VOICE) VOICE = pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    if (VOICE) { u.voice = VOICE; u.lang = VOICE.lang; }
    u.rate = 1.02; u.pitch = 0.6; u.volume = 1;   // low pitch for the gruff register
    if (!queue) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}
const hush = () => { try { if (speechOK()) speechSynthesis.cancel(); } catch (e) {} };

function toggleVoice() {
  S.voice = !S.voice; save();
  if (S.voice) say('Voice on.');
  else hush();
  home();
}

/* ---------- home ---------- */

    </div>`;
}

function cycleDay(dir) {
  const i = ORDER.indexOf(S.next);
  S.next = ORDER[(i + dir + ORDER.length) % ORDER.length];
  save(); home();
}
function setLevel(dir) {
  S.level = Math.min(5, Math.max(1, S.level + dir));
  save(); home();
}

/* ---------- session ---------- */

let sess = null;

function startSession(dayKey) {
  const d = dayKey || S.next;
  go(); lockScreen();
  say('Next up. ' + EX[(typeof DAYS[d].ex[0] === 'string' ? DAYS[d].ex[0] : DAYS[d].ex[0].id)].n + '.');
  sess = { day: d, q: buildSequence(d), i: 0, left: 0, paused: false, switched: false };
  sess.left = sess.q[0].dur;
  renderStep(); runClock();
}

function runClock() {
  clearInterval(sess.timer);
  sess.timer = setInterval(() => {
    if (sess.paused) return;
    sess.left--;

    const st = sess.q[sess.i];
    if (st.kind === 'work' && EX[st.id].sides && !sess.switched && sess.left === Math.floor(st.dur / 2)) {
      sess.switched = true; switchS(); flashSwitch(); say('Other side.');
    }
    if (st.kind === 'work' && st.dur >= 30 && sess.left === 5) say('Five seconds.');
    if (st.kind === 'prep' && sess.left === 3) say('Ready.');
    if (sess.left <= 3 && sess.left > 0) tick();
    if (sess.left <= 0) { advance(); return; }
    paintClock();
  }, 1000);
}

function advance() {
  sess.i++; sess.switched = false;
  if (sess.i >= sess.q.length) return finish();
  sess.left = sess.q[sess.i].dur;
  const k = sess.q[sess.i].kind;
  if (k === 'work') { go(); say('Go.'); }
  if (k === 'prep') { beep(440, 110, 0.12); say('Next up. ' + EX[sess.q[sess.i].id].n + '.'); }
  renderStep();
}

function jump(dir) {
  hush();
  let i = sess.i + dir;
  while (i > 0 && i < sess.q.length && sess.q[i].kind !== 'work') i += dir;
  if (i < 0) i = 0;
  if (i >= sess.q.length) return finish();
  sess.i = i; sess.left = sess.q[i].dur; sess.switched = false;
  renderStep();
}

function togglePause() {
  sess.paused = !sess.paused;
  $('#pause').textContent = sess.paused ? 'Resume' : 'Pause';
  document.body.classList.toggle('paused', sess.paused);
}

function quit() {
  clearInterval(sess.timer); stopAnims(); hush(); sess = null; home();
}

function flashSwitch() {
  const el = $('#switchflag');
  if (!el) return;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2600);
}

function progressOf() {
  const total = sess.q.reduce((a, s) => a + s.dur, 0);
  let passed = 0;
  for (let i = 0; i < sess.i; i++) passed += sess.q[i].dur;
  passed += sess.q[sess.i].dur - sess.left;
  return passed / total;
}

function paintClock() {
  const st = sess.q[sess.i];
  const c = $('#count'); if (c) c.textContent = sess.left;
  const r = $('#ring');
  if (r) {
    // ring starts whole and drains away as the seconds go
    const C = 2 * Math.PI * r.r.baseVal.value;
    const remaining = Math.max(0, sess.left) / st.dur;
    r.style.strokeDasharray = String(C);
    r.style.strokeDashoffset = String(C * (1 - remaining));
  }
  const b = $('#bar'); if (b) b.style.width = (progressOf() * 100).toFixed(2) + '%';
}

// small "what's coming" strip shown under the cues on an exercise screen
function peek() {
  const st = nextWorkStep(sess.i);
  if (!st) return `<div class="peek last"><span class="peek-k">Last one</span>
    <span class="peek-n">Then you're done</span></div>`;
  const e = EX[st.id];
  return `<div class="peek">
    <span class="peek-fig">${figureSVG(e)}</span>
    <span class="peek-body">
      <span class="peek-k">Next</span>
      <span class="peek-n">${e.n}</span>
      <span class="peek-s">${e.slot} · ${st.dur}sec${e.sides ? ' · per side' : ''}</span>
    </span>
  </div>`;
}

// the bar that stays pinned at the top of a running session
function topbar(st, e, nWork, label) {
  return `
    <div class="topbar">
      <div class="bar-wrap"><div id="bar" class="bar"></div></div>
      <div class="topbar-in">
        <div class="clock mini">
          <svg viewBox="0 0 80 80" class="ring-svg">
            <circle class="ring-bg" cx="40" cy="40" r="34"/>
            <circle id="ring" class="ring-fg" cx="40" cy="40" r="34"/>
          </svg>
          <span id="count" class="count">${sess.left}</span>
        </div>
        <div class="topmeta">
          <p class="eyebrow">${label}</p>
          <h2 class="exname">${e.n}</h2>
          <p class="exvar">${e.prog[S.level - 1]}</p>
        </div>
      </div>
    </div>`;
}

function renderStep() {
  const st = sess.q[sess.i];
  const nWork = sess.q.filter(s => s.kind === 'work').length;

  if (st.kind === 'prep') {
    const e = EX[st.id];
    const label = `Next up · ${String(st.n).padStart(2, '0')} of ${String(nWork).padStart(2, '0')} · ${e.slot} · ${e.dur}sec${e.sides ? ' · per side' : ''}`;
    app().innerHTML = `
      ${topbar(st, e, nWork, label)}
      <section class="screen prep">
        <div class="stage">${animatedFigure(e)}</div>

        <p class="how">${e.how}</p>
        <ul class="cues">${e.c.map(c => `<li class="${c[2] ? 'warn' : ''}"><span class="k">${c[0]}</span><span>${c[1]}</span></li>`).join('')}</ul>

        <div class="controls">
          <button onclick="jump(-1)">Back</button>
          <button id="pause" onclick="togglePause()">Pause</button>
          <button onclick="jump(1)">Skip</button>
        </div>
        <button class="quit" onclick="quit()">End session</button>
      </section>`;
    paintClock(); startAnims(e);
    return;
  }

  const e = EX[st.id];
  const label = `${String(st.n).padStart(2, '0')} of ${String(nWork).padStart(2, '0')} · ${e.slot}${e.sides ? ' · per side' : ''}`;
  app().innerHTML = `
    ${topbar(st, e, nWork, label)}
    <section class="screen">
      <div class="stage">${animatedFigure(e)}
        <div id="switchflag" class="switchflag">Switch sides</div>
      </div>

      <p class="how">${e.how}</p>
      <ul class="cues">${e.c.map(c => `<li class="${c[2] ? 'warn' : ''}"><span class="k">${c[0]}</span><span>${c[1]}</span></li>`).join('')}</ul>

      ${peek()}

      <div class="controls">
        <button onclick="jump(-1)">Back</button>
        <button id="pause" onclick="togglePause()">Pause</button>
        <button onclick="jump(1)">Skip</button>
      </div>
      <button class="quit" onclick="quit()">End session</button>
    </section>`;
  paintClock(); startAnims(e);
}

/* ---------- confetti ---------- */

function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const cv = document.createElement('canvas');
  cv.className = 'confetti';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function size() {
    cv.width = window.innerWidth * dpr;
    cv.height = window.innerHeight * dpr;
    cv.style.width = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();

  const W = () => cv.width / dpr, H = () => cv.height / dpr;
  const colors = ['#c3f04a', '#ece9e3', '#8fb833', '#ff8a5c', '#6f7d86'];
  const bits = [];

  // two party poppers in the bottom corners, each firing up and across
  // angles in degrees, measured from the x-axis, negative = upwards
  [[0.06, -78, -28], [0.94, -152, -102]].forEach(([xf, a0, a1]) => {
    for (let i = 0; i < 75; i++) {
      const ang = (a0 + Math.random() * (a1 - a0)) * Math.PI / 180;
      const sp = 13 + Math.random() * 13;
      bits.push({
        x: W() * xf, y: H() * 0.95,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        w: 5 + Math.random() * 6, h: 3 + Math.random() * 5,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
        c: colors[(Math.random() * colors.length) | 0],
        life: 1
      });
    }
  });

  let start = null;
  function frame(t) {
    if (!start) start = t;
    const age = (t - start) / 1000;
    ctx.clearRect(0, 0, W(), H());

    let alive = 0;
    bits.forEach(b => {
      b.vy += 0.42;              // gravity
      b.vx *= 0.995;             // drag
      b.x += b.vx; b.y += b.vy;
      b.rot += b.vr;
      if (age > 1.6) b.life = Math.max(0, b.life - 0.022);
      if (b.y < H() + 40 && b.life > 0) alive++;

      ctx.save();
      ctx.globalAlpha = b.life;
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    });

    if (alive > 0 && age < 6) requestAnimationFrame(frame);
    else cv.remove();
  }
  requestAnimationFrame(frame);
}

/* ---------- finish ---------- */

function finish() {
  clearInterval(sess.timer); stopAnims(); done(); unlockScreen(); confetti();
  say(SIGNOFF[Math.floor(Math.random() * SIGNOFF.length)]);
  const d = sess.day;
  const inRotation = ORDER.indexOf(d) >= 0;
  S.log.push({ d: today(), day: d, level: S.level });
  if (inRotation) S.next = ORDER[(ORDER.indexOf(d) + 1) % ORDER.length];
  save();
  sess = null;

  app().innerHTML = `
    <section class="screen done">
      <p class="eyebrow">${inRotation ? 'Day ' + d : DAYS[d].title} complete</p>
      <h1 class="bigdone">That's it.</h1>
      <p class="stats center">
        <span><b>${streak()}</b> day streak</span>
        <span><b>${S.log.length}</b> sessions</span>
        <span><b>L${S.level}</b> level</span>
      </p>
      <p class="foot center">${inRotation ? 'Tomorrow is Day ' + S.next + ' — ' + DAYS[S.next].title + '.'
        : 'An extra, so the rotation is untouched — Day ' + S.next + ' is still next.'}</p>
      ${checkDue() ? `<button class="cta" onclick="checkin()">Do the two-week re-test</button>` : ''}
      <button class="cta ghost" onclick="home()">Back</button>
    </section>`;
}

/* ---------- check-in ---------- */

function checkin() {
  const prev = S.checks[S.checks.length - 1];
  app().innerHTML = `
    <header class="mast">
      <p class="eyebrow">Re-test · every two weeks</p>
      <h1>Where are you now?</h1>
      <p class="lede">Three markers, ninety seconds. Rest a minute between them. Be honest — the numbers only help if they're real.</p>
    </header>
    <div class="pad">
      <label class="field">
        <span class="flabel">Clean push-ups in 45 seconds</span>
        <input id="m1" type="number" inputmode="numeric" placeholder="reps">
        ${prev ? `<span class="prev">last time: ${prev.m1}</span>` : ''}
      </label>
      <label class="field">
        <span class="flabel">Hollow hold to failure, seconds</span>
        <input id="m2" type="number" inputmode="numeric" placeholder="seconds">
        ${prev ? `<span class="prev">last time: ${prev.m2}</span>` : ''}
      </label>
      <label class="field">
        <span class="flabel">Deep squat, heels flat</span>
        <select id="m3">
          <option value="0">Heels lift or I need support</option>
          <option value="1">Heels down, but a struggle</option>
          <option value="2">Comfortable, could sit there</option>
        </select>
        ${prev ? `<span class="prev">last time: ${['heels lift', 'a struggle', 'comfortable'][prev.m3]}</span>` : ''}
      </label>
      <button class="cta" onclick="saveCheck()">Save and see the verdict</button>
      <button class="cta ghost" onclick="home()">Not now</button>
    </div>`;
}

function saveCheck() {
  const m1 = +($('#m1').value || 0), m2 = +($('#m2').value || 0), m3 = +$('#m3').value;
  const prev = S.checks[S.checks.length - 1];
  const rec = { d: today(), m1, m2, m3, level: S.level };
  S.checks.push(rec);

  let verdict, note, moved = 0;
  if (!prev) {
    verdict = 'Baseline set';
    note = "Nothing to compare against yet. Stay at level " + S.level + " and re-test in two weeks — that comparison is the useful one.";
  } else {
    const up = (m1 > prev.m1) + (m2 > prev.m2 + 2) + (m3 > prev.m3);
    const dn = (m1 < prev.m1) + (m2 < prev.m2 - 2) + (m3 < prev.m3);
    if (up >= 2 && S.level < 5) { S.level++; moved = 1; verdict = 'Level up'; note = "Two of three markers improved. You're now on level " + S.level + " — every exercise steps up to its harder version."; }
    else if (up >= 2) { verdict = 'Top of the scale'; note = "Two of three improved, but you're already at level 5. Hold here and start adding a second round on the days you have ten minutes."; }
    else if (dn >= 2 && S.level > 1) { S.level--; moved = -1; verdict = 'Level down'; note = "Two of three went backwards. That's information, not failure — often sleep or a busy fortnight. Level " + S.level + " for the next two weeks."; }
    else { verdict = 'Hold'; note = "Mixed or flat. Stay on level " + S.level + " and repeat the fortnight. Plateaus are normal and usually break on their own."; }
  }
  save();

  app().innerHTML = `
    <section class="screen done">
      <p class="eyebrow">Re-test saved</p>
      <h1 class="bigdone">${verdict}</h1>
      <p class="how center">${note}</p>
      ${prev ? `<table class="cmp">
        <tr><td>Push-ups</td><td>${prev.m1}</td><td class="arrow">→</td><td><b>${m1}</b></td></tr>
        <tr><td>Hollow hold</td><td>${prev.m2}sec</td><td class="arrow">→</td><td><b>${m2}sec</b></td></tr>
        <tr><td>Deep squat</td><td>${prev.m3}/2</td><td class="arrow">→</td><td><b>${m3}/2</b></td></tr>
      </table>` : ''}
      <button class="cta" onclick="home()">Done</button>
    </section>`;
}

/* ---------- boot ---------- */
window.addEventListener('DOMContentLoaded', home);
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

</script>
